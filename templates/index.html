<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小镜 · 眼镜状态</title>
<link rel="stylesheet" href="/static/style.css">
<main>
  <header><h1>小镜 <small>眼镜状态</small></h1><span id="connection">正在连接后端</span></header>
  <p id="status" role="status">等待设备</p>
  <div class="views">
    <section><h2>原始画面</h2><div class="frame"><img id="raw" alt="等待眼镜画面" hidden></div></section>
    <section><h2>WalkGuide 分割</h2><div class="frame"><img id="overlay" alt="等待处理结果" hidden></div></section>
  </div>
  <p id="stats"></p>
  <div class="logs">
    <section><h2>视觉提醒与设备事件</h2><ol id="alerts" aria-live="polite"></ol></section>
    <section><h2>AI 对话</h2><p id="voice"></p><ol id="dialog" aria-live="polite"></ol></section>
  </div>
</main>
<script src="/static/console.js"></script>
</html>
